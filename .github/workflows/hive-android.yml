name: Hive — Android app

# Builds The Hive as an installable Android app (.apk) for sideloading
# onto a phone such as a Samsung Galaxy. Download it from the run's
# "Artifacts" section.

on:
  push:
    paths: ["hive/**", ".github/workflows/hive-android.yml"]
  workflow_dispatch:

concurrency:
  group: hive-android-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # to publish the APK to the hive-latest release

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android && npx cap sync android

      # Sources live in hive/assets: icon-only, icon-foreground (transparent,
      # inside the adaptive-icon safe zone) and icon-background.
      - name: Use the Hive icon
        run: npx --yes @capacitor/assets@3 generate --android

      - name: Build APK
        working-directory: hive/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TheHive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TheHive-android
          path: hive/TheHive.apk
          retention-days: 30

      # A release gives a plain download link that works on a phone without
      # signing in: .../releases/download/hive-latest/TheHive.apk
      - name: Publish to the hive-latest release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release delete hive-latest --yes --cleanup-tag || true
          gh release create hive-latest TheHive.apk --prerelease --target "$GITHUB_SHA" \
            --title "The Hive — Android app" \
            --notes "Latest build of The Hive for Android (built from ${GITHUB_REF_NAME} @ ${GITHUB_SHA::7}). Tap TheHive.apk below to download it on your phone."
