name: Hive — Android app

# Builds The Hive as an installable Android app (.apk) for sideloading
# onto a phone such as a Samsung Galaxy. Download it from the run's
# "Artifacts" section.

on:
  push:
    paths: ["hive/**", ".github/workflows/hive-android.yml"]
  workflow_dispatch:

concurrency:
  group: hive-android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hive
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install Capacitor
        run: npm install --no-audit --no-fund

      - name: Create Android project
        run: npx cap add android && npx cap sync android

      - name: Use the Hive icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cp www/icons/icon-1024.png assets/icon-only.png
          cp www/icons/icon-1024.png assets/icon-foreground.png
          npx --yes @capacitor/assets@3 generate --android \
            --iconBackgroundColor '#14110A' --iconBackgroundColorDark '#14110A'

      - name: Build APK
        working-directory: hive/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Name the file
        run: cp android/app/build/outputs/apk/debug/app-debug.apk TheHive.apk

      - uses: actions/upload-artifact@v4
        with:
          name: TheHive-android
          path: hive/TheHive.apk
          retention-days: 30
