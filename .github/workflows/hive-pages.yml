name: Hive — iPhone home-screen app (GitHub Pages)

# Publishes hive/www to GitHub Pages so it can be added to an iPhone's
# home screen from Safari. One-time setup: repo Settings → Pages →
# Source: "GitHub Actions".

on:
  push:
    branches: [master]
    paths: ["hive/www/**", ".github/workflows/hive-pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: hive-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: hive/www
      - id: deployment
        uses: actions/deploy-pages@v4
